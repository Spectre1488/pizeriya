<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuoco — доставка піци</title>
<style>
:root{--bg:#ffffff;--card:#fff;--text:#16301a;--muted:#46604a;--accent:#2a9d3f;--accent-t:#fff;--soft:#e6f7db;--yellow:#ffc61a;--line:#a9d98c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1b5230;z-index:30}
.w{max-width:1100px;margin:0 auto;padding:0 16px}
.top{--bg:#f1f8ec;background:#1b5230;color:#fff}
.top .w{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-.5px}.logo span{color:var(--yellow)}
.info{font-size:.85rem;line-height:1.35}.info small{color:#cfe9c8}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:0 14px}
.search input{border:0;background:transparent;color:var(--text);padding:12px 0;width:100%;font-size:.95rem;outline:none}
.pill{border-radius:999px;background:var(--bg);color:var(--text);padding:10px 14px;font-size:.85rem;font-weight:600}
.cartb{position:relative;width:46px;height:46px;border-radius:50%;background:var(--yellow);border:0;cursor:pointer;display:grid;place-items:center}
.cartb b{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-t);border-radius:999px;font-size:.7rem;padding:2px 6px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1b5230;box-shadow:0 6px 16px #0003}
.tabs .w{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
.tabs a{white-space:nowrap;padding:9px 16px;border-radius:999px;color:#cfe9c8;text-decoration:none;font-size:.92rem}
.tabs a.on{background:var(--yellow);color:#16301a;font-weight:700}
.strip{margin:18px 0 0;background:linear-gradient(90deg,#2a9d3f,#5cc24a);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:.95rem}
h2{font-size:1.4rem;margin:28px 0 14px;scroll-margin-top:80px}
main{color:var(--text)}main .ds{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 18px}
.it{position:relative}
.pic{position:relative;aspect-ratio:1;display:grid;place-items:center}
.pic svg{width:92%;filter:drop-shadow(0 8px 10px #00000026)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.leaf{position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;background:#dff5df;display:grid;place-items:center}
.nm{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.nm h3{margin:0;font-size:1.05rem}
.heart{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center}
.pr{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.price{background:var(--soft);color:var(--accent);font-weight:700;border-radius:8px;padding:3px 10px}
.add{background:var(--yellow);color:#16301a;border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.ds{font-size:.82rem;color:var(--muted)}
.bd{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--text);border-radius:6px;padding:2px 8px}
.ov{position:fixed;inset:0;background:#0007;z-index:40;display:none}
.dr{--bg:#f1f8ec;position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:41;display:none;flex-direction:column;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.open{display:block}.dr.open{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0}.x{background:none;border:0;color:var(--text);font-size:1.6rem;cursor:pointer}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.tot{font-weight:700;display:flex;justify-content:space-between;padding:12px 0}
form{display:grid;gap:10px}
input.f,select.f{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.lb{font-size:.85rem;color:var(--muted);margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--text);padding:10px;border-radius:9px;cursor:pointer;font-size:.9rem}
.seg button.on{background:var(--card);box-shadow:0 1px 4px #0002;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center;min-width:56px}
.chip small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase}
.chip b{font-size:1.05rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}.chip.on small{color:var(--accent-t);opacity:.85}
.sub{background:var(--accent);color:var(--accent-t);border:0;border-radius:12px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer}
#ok{display:none;color:var(--accent);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:36px 0 28px}
</style>
</head>
<body>
<header class="top"><div class="w">
  <div class="logo">Fuo<span>co</span></div>
  <div class="info">вул. Соборна, 10<br><small>0 800 000 000 · безкоштовно по Україні</small></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Пошук продуктів"></label>
  <span class="pill">UA</span>
  <button class="cartb" id="cb" aria-label="Кошик"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1a17" stroke-width="2"><path d="M3 9h18l-2 11H5z"/><path d="M8 9l3-5M16 9l-3-5"/></svg><b id="cnt">0</b></button>
</div></header>
<nav class="tabs"><div class="w" id="tabs"></div></nav>
<main class="w">
  <div class="strip">Доставка за 40 хвилин · безкоштовно від 500 ₴ · щодня 11:00–23:00</div>
  <div id="menu"></div>
</main>
<footer>Fuoco · вул. Соборна, 10 · 0 800 000 000</footer>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr">
  <div class="dh"><h2>Кошик</h2><button class="x" id="cl" aria-label="Закрити">×</button></div>
  <div id="list"></div>
  <form id="f">
    <input class="f" name="name" placeholder="Ім’я" required>
    <input class="f" name="phone" type="tel" placeholder="Телефон, +380…" required>
    <input class="f" name="address" placeholder="Адреса доставки" required>
    <div class="lb">Коли доставити</div>
    <div id="when"></div>
    <select class="f" name="pay"><option>Готівкою кур’єру</option><option>Карткою кур’єру</option><option>Онлайн</option></select>
    <button class="sub" type="submit">Оформити замовлення</button>
    <div id="ok"></div>
  </form>
</aside>
<script>
const $=i=>document.getElementById(i);
const rnd=s=>()=>(s=(s*9301+49297)%233280)/233280;
function pz(k,seed){const r=rnd(seed),C={pep:['#b8322a','#9c2620'],marg:['#d9402c','#2f8f3e'],ham:['#f0a3a3','#ffd45a'],mush:['#dcc8aa','#a98967'],veg:['#3f9a3f','#e0452f','#f2c230'],bbq:['#8a4b2a','#f2c230','#d9402c']},c=C[k];let t='';
if(k==='cheese'){for(let i=1;i<5;i++)t+=`<circle cx="60" cy="60" r="${i*9}" fill="none" stroke="#f0b93c" stroke-width="3" opacity=".8"/>`}
else for(let i=0;i<18;i++){const a=r()*6.283,d=Math.sqrt(r())*38,x=(60+d*Math.cos(a)).toFixed(1),y=(60+d*Math.sin(a)).toFixed(1),col=c[i%c.length];
t+=k==='pep'?`<circle cx="${x}" cy="${y}" r="6.5" fill="${col}"/><circle cx="${x}" cy="${y}" r="1.6" fill="#7a1c17" opacity=".6"/>`:`<ellipse cx="${x}" cy="${y}" rx="5.5" ry="3" fill="${col}" transform="rotate(${(r()*180).toFixed(0)} ${x} ${y})"/>`}
return `<svg viewBox="0 0 120 120"><defs><radialGradient id="g${seed}"><stop offset="60%" stop-color="#ffe680"/><stop offset="100%" stop-color="#ffd24d"/></radialGradient></defs><circle cx="60" cy="60" r="58" fill="#f2bd6c"/><circle cx="60" cy="60" r="52" fill="#ee4a2e"/><circle cx="60" cy="60" r="49" fill="url(#g${seed})"/>${t}</svg>`}
const bottle=c=>`<svg viewBox="0 0 120 120"><rect x="47" y="8" width="26" height="14" rx="4" fill="#8a8f98"/><rect x="38" y="22" width="44" height="92" rx="14" fill="${c}"/><rect x="38" y="54" width="44" height="30" fill="#fff" opacity=".85"/></svg>`;
const cup=c=>`<svg viewBox="0 0 120 120"><ellipse cx="60" cy="100" rx="38" ry="8" fill="#0002"/><path d="M26 48h68l-8 50H34z" fill="${c}"/><rect x="24" y="38" width="72" height="14" rx="7" fill="#fff" opacity=".92"/></svg>`;
const cats=[['pizza','Піца'],['drinks','Напої'],['dessert','Десерти'],['sauce','Соуси']];
const I=[
['marg','pizza','Маргарита','Моцарела, помідори, базилік, фірмовий соус',149,pz('marg',1),1,'Вигідно'],
['pep','pizza','Пепероні','Пепероні, моцарела, томатний соус',199,pz('pep',2),0,'Хіт'],
['cheese','pizza','Чотири сири','Моцарела, горгонзола, пармезан, чеддер',219,pz('cheese',3),1,''],
['ham','pizza','Гавайська','Шинка, ананас, моцарела',189,pz('ham',4),0,''],
['mush','pizza','Грибна','Печериці, вершковий соус, часник',179,pz('mush',5),1,''],
['veg','pizza','Овочева','Перець, томати, печериці, оливки',169,pz('veg',6),1,''],
['bbq','pizza','Барбекю з куркою','Курка, бекон, цибуля, соус барбекю',229,pz('bbq',7),0,'Новинка'],
['cola','drinks','Кола 0,5 л','Холодна, у пляшці',45,bottle('#3b1d10'),0,''],
['water','drinks','Вода мінеральна 0,5 л','Газована або негазована',30,bottle('#7cc7e8'),0,''],
['lemonade','drinks','Лимонад домашній 0,4 л','Лимон, м’ята, імбир',65,bottle('#f2c94c'),0,''],
['juice','drinks','Сік апельсиновий 0,3 л','Свіжовичавлений',75,bottle('#f28c28'),0,''],
['cheesecake','dessert','Чізкейк','Класичний, з ягідним соусом',95,cup('#f3d9a4'),0,''],
['tiramisu','dessert','Тірамісу','Маскарпоне, кава, какао',110,cup('#b98a5e'),0,''],
['garlic','sauce','Часниковий','Соус 40 г',20,cup('#f5efe0'),0,''],
['cheesesauce','sauce','Сирний','Соус 40 г',25,cup('#f6c453'),0,''],
['bbqsauce','sauce','Барбекю','Соус 40 г',25,cup('#7a3a1d'),0,'']];
const leaf='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9e44" stroke-width="2"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-15 15zM5 19l8-8"/></svg>';
const heart=f=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="${f?'#ff5a1f':'none'}" stroke="#ff5a1f" stroke-width="2"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>`;
let cart={},fav={},mode='asap',di=0,tm='',filter='';
function menu(){
  $('tabs').innerHTML=cats.map((c,i)=>`<a href="#c-${c[0]}" class="${i?'':'on'}">${c[1]}</a>`).join('');
  $('menu').innerHTML=cats.map(c=>{
    const l=I.filter(x=>x[1]===c[0]&&(x[2]+x[3]).toLowerCase().includes(filter));if(!l.length)return'';
    return `<h2 id="c-${c[0]}">${c[1]}</h2><div class="grid">`+l.map(x=>`<div class="it"><div class="pic">${x[5]}<img src="img/${x[0]}.png" alt="${x[2]}" onerror="this.remove()">${x[6]?`<span class="leaf">${leaf}</span>`:''}</div><div class="nm"><h3>${x[2]}</h3><button class="heart" data-h="${x[0]}" aria-label="Вподобати">${heart(fav[x[0]])}</button></div><div class="pr"><span class="price">${x[4]} ₴</span><button class="add" data-a="${x[0]}">У кошик</button></div><div class="ds">${x[3]}</div>${x[7]?`<span class="bd">${x[7]}</span>`:''}</div>`).join('')+'</div>'}).join('')||'<p>Нічого не знайдено.</p>';
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>chg(b.dataset.a,1));
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{fav[b.dataset.h]=!fav[b.dataset.h];menu()});
  document.querySelectorAll('.tabs a').forEach(a=>a.onclick=()=>{document.querySelectorAll('.tabs a').forEach(t=>t.classList.remove('on'));a.classList.add('on')});
}
function chg(id,s){cart[id]=Math.max(0,(cart[id]||0)+s);list()}
function list(){
  const ids=Object.keys(cart).filter(k=>cart[k]>0);let sum=0;
  $('list').innerHTML=ids.length?ids.map(k=>{const m=I.find(x=>x[0]===k);sum+=m[4]*cart[k];return `<div class="ci"><span>${m[2]}</span><span class="q"><button data-d="${k}" data-s="-1">−</button> ${cart[k]} <button data-d="${k}" data-s="1">+</button></span><b>${m[4]*cart[k]} ₴</b></div>`}).join('')+`<div class="tot"><span>Разом</span><span>${sum} ₴</span></div><p class="ds">${sum<500?'До безкоштовної доставки ще '+(500-sum)+' ₴':'Доставка безкоштовна'}</p>`:'<p class="ds">Кошик порожній, додайте щось із меню.</p>';
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>chg(b.dataset.d,+b.dataset.s));
  $('cnt').textContent=ids.reduce((a,k)=>a+cart[k],0);
}
const days=[...Array(10)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
function slots(d){const out=[],now=new Date(),min=now.getHours()*60+now.getMinutes()+60;for(let m=11*60;m<=22*60+30;m+=30){if(d.toDateString()!==now.toDateString()||m>=min)out.push(String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0'))}return out}
function when(){
  let h=`<div class="seg"><button type="button" data-m="asap" class="${mode==='asap'?'on':''}">Якнайшвидше</button><button type="button" data-m="later" class="${mode==='later'?'on':''}">На певний час</button></div>`;
  if(mode==='later'){const s=slots(days[di]);if(!s.includes(tm))tm=s[0]||'';
    h+=`<div class="chips" style="margin-top:10px">`+days.map((d,i)=>`<button type="button" class="chip ${i===di?'on':''}" data-di="${i}"><small>${i?d.toLocaleDateString('uk-UA',{weekday:'short'}):'сьог.'}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('uk-UA',{month:'short'})}</small></button>`).join('')+`</div><div class="chips">`+(s.length?s.map(t=>`<button type="button" class="chip ${t===tm?'on':''}" data-t="${t}"><b>${t}</b></button>`).join(''):'<span class="ds">На сьогодні вільних слотів немає, оберіть інший день.</span>')+`</div>`}
  $('when').innerHTML=h;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;when()});
  document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{di=+b.dataset.di;tm='';when()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tm=b.dataset.t;when()});
}
const open=v=>{$('ov').classList.toggle('open',v);$('dr').classList.toggle('open',v)};
$('cb').onclick=()=>open(true);$('cl').onclick=()=>open(false);$('ov').onclick=()=>open(false);
$('q').oninput=e=>{filter=e.target.value.trim().toLowerCase();menu()};
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const ids=Object.keys(cart).filter(k=>cart[k]>0);
  if(!ids.length){$('ok').textContent='Спочатку додайте щось до кошика.';$('ok').style.display='block';return}
  const form=e.target,d=Object.fromEntries(new FormData(form)),btn=form.querySelector('.sub');
  const t=mode==='asap'?'протягом 40 хвилин':days[di].toLocaleDateString('uk-UA',{day:'numeric',month:'long'})+' о '+tm;
  const sum=ids.reduce((a,k)=>a+I.find(x=>x[0]===k)[4]*cart[k],0);
  const text='Нове замовлення\n'+ids.map(k=>'• '+I.find(x=>x[0]===k)[2]+' × '+cart[k]).join('\n')+'\nРазом: '+sum+' ₴\nІм’я: '+d.name+'\nТелефон: '+d.phone+'\nАдреса: '+d.address+'\nКоли: '+t+'\nОплата: '+d.pay;
  btn.disabled=true;
  try{
    const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok)throw new Error('send failed');
    $('ok').textContent='Дякуємо! Замовлення прийнято, доставимо '+t+'.';cart={};form.reset();list();
  }catch(err){$('ok').textContent='Не вдалося надіслати замовлення. Зателефонуйте нам.'}
  $('ok').style.display='block';btn.disabled=false;
});
menu();list();when();
</script>
</body>
</html>
